name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  versions:
    name: Version declarations agree
    # The README badge sat at 1.4.0 while this skill shipped 1.5.0, 1.6.0 and
    # 1.6.1 (wordpress-api-pro's at 3.8.2 through 3.9.5): nothing compared
    # them. Every place that states the version has to say the same thing,
    # on pull requests too, so the bump that forgets one is caught before merge.
    runs-on: ubuntu-latest
    env:
      SKILL: files/SKILL.md
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md, README badge, package.json and "Current version" lines agree
        run: |
          set -euo pipefail
          skill_v=$(grep -m1 '^version:' "$SKILL" | sed 's/^version:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
          [ -n "$skill_v" ] || { echo "::error::no version: in $SKILL"; exit 1; }
          mismatch=0
          # Color-agnostic, and the WHOLE semver: after the x.y.z core take
          # every character a prerelease or build-metadata suffix can carry -
          # shields.io writes a dash inside the value as "--" and a "+" as
          # itself (measured: version-1.2.0--rc.1-blue renders "1.2.0-rc.1",
          # version-1.2.0+build.7-blue "1.2.0+build.7", and
          # version-1.2.0+build--2-blue "1.2.0+build-2") - and stop at the first
          # single dash, which is the colour separator. Then fold "--" back. A
          # prerelease is a legitimate version here - release-drift.yml accepts
          # one - and the check must not reject a consistent bump to it.
          badge_v=$(grep -oE 'badge/version-[0-9]+\.[0-9]+\.[0-9]+(--|[0-9A-Za-z.+])*' README.md | head -1 | sed 's|badge/version-||; s|--|-|g' || true)
          [ "$badge_v" = "$skill_v" ] || { echo "::error::README badge says ${badge_v:-<none>}, $SKILL says $skill_v"; mismatch=1; }
          pkg_v=""
          if [ -f package.json ]; then
            pkg_v=$(jq -r .version package.json)
            [ "$pkg_v" = "$skill_v" ] || { echo "::error::package.json says $pkg_v, $SKILL says $skill_v"; mismatch=1; }
          fi
          # Every "Current version: **x.y.z**" line in the README, if any.
          for v in $(grep -oE 'Current version: \*\*[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*\*\*' README.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' || true); do
            [ "$v" = "$skill_v" ] || { echo "::error::README 'Current version' says $v, $SKILL says $skill_v"; mismatch=1; }
          done
          [ "$mismatch" = 0 ] || { echo "::error::bump every declaration in the same commit"; exit 1; }
          echo "SKILL.md, README badge${pkg_v:+, package.json} agree on $skill_v"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: '.'
          additional_files: 'new-client.sh INSTALL.sh'
        env:
          SHELLCHECK_OPTS: -e SC1091

      - name: bash -n syntax
        run: |
          for f in INSTALL.sh new-client.sh files/setup-elementor-mcp.sh; do
            echo "syntax: $f"; bash -n "$f"
          done

      - name: SKILL.md frontmatter lint
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("files/SKILL.md").read_text()
          m = re.match(r'^---\n(.*?)\n---\n', p, re.S)
          assert m, "SKILL.md missing YAML frontmatter block"
          fm = m.group(1)
          for key in ("name", "description"):
              mm = re.search(rf'^{key}:\s*(.+)$', fm, re.M)
              assert mm and mm.group(1).strip(), f"SKILL.md frontmatter missing non-empty {key}"
          print("SKILL.md frontmatter OK")
          PY

      - name: Brand-kit reference check
        run: |
          python3 - <<'PY'
          import re, json, pathlib
          md = pathlib.Path("files/references/brand-kit.md").read_text()
          blocks = re.findall(r"```json\n(.*?)\n```", md, re.S)
          assert blocks, "brand-kit.md has no json examples"
          for b in blocks:
              json.loads(b)
          skill = pathlib.Path("files/SKILL.md").read_text()
          assert "references/brand-kit.md" in skill, "SKILL.md must reference brand-kit.md"
          print(f"brand-kit ok ({len(blocks)} json blocks)")
          PY

      - name: Recipe library check
        run: |
          python3 - <<'PY'
          import re, pathlib
          md = pathlib.Path("files/references/recipes.md").read_text()
          titles = ["Hero","Services grid","Split (image + text)","Stats band","Testimonials",
                    "CTA band","Contact","FAQ","Pricing","Logos strip"]
          heads = re.findall(r"^##\s+(.+)$", md, re.M)
          missing = [t for t in titles if t not in heads]
          assert not missing, f"missing recipes: {missing}"
          for tok in ("brand","surface","heading","text"):
              assert tok in md, f"recipes.md should reference token '{tok}'"
          skill = pathlib.Path("files/SKILL.md").read_text()
          assert "references/recipes.md" in skill, "SKILL must reference recipes.md"
          print(f"recipe library ok ({len(titles)} recipes)")
          PY

      - name: dry-run smoke (no network)
        run: |
          set +e
          bash new-client.sh --dry-run --local "NoSuchSite__xyz" --user u --app-pass p
          code=$?
          # nonexistent local site aborts at resolution (exit 1); a crash/traceback
          # would be a different failure. Accept 0 or 1, reject anything else.
          if [ "$code" -gt 1 ]; then echo "unexpected exit $code"; exit 1; fi
          echo "dry-run smoke ok (exit $code)"

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: bash tests/run.sh
